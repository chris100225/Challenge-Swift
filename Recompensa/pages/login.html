<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swift — Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    a { text-decoration: none; color: inherit; }
    :root { --brand:#E84B2D; --text:#111; --muted:#6C757D; }

    html,body{height:100%}
    body{
      background:var(--brand);
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    .login-card{
      width:clamp(320px,90vw,560px);
      border:0;border-radius:20px;
      box-shadow:0 10px 24px rgba(0,0,0,.15);
      background-color:#f7f7f7;
    }
    .card-body{padding:3rem}
    @media (max-width:576px){ .card-body{padding:2rem} }
    .logo{display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;user-select:none}
    .logo-img{height:52px;width:auto}
    @media (max-width:480px){ .logo-img{height:44px} }
    .form-control{
      height:48px;border-radius:9999px;border-color:#dadada;
      box-shadow:inset 0 -1px 0 rgba(0,0,0,.02);
    }
    .form-control::placeholder{color:var(--muted)}
    .btn-brand{
      background:var(--brand);color:#fff;border-radius:9999px;
      padding-block:.9rem;font-weight:600;
    }
    .btn-brand:hover,.btn-brand:focus{background:#d04327;color:#fff}
  </style>
</head>
<body>
  <main class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card login-card">
      <div class="card-body">
        <div class="logo">
          <img src="../assets/images/NOVA_LOGO_SWIFT_-removebg-preview 1.png" alt="Swift" class="logo-img" loading="eager" decoding="async">
        </div>

        <form class="d-grid gap-3" action="inicio.html" method="get">
          <div>
            <label for="email" class="visually-hidden">E-mail</label>
            <input id="email" name="email" type="email" class="form-control"
                   placeholder="E-mail" aria-label="E-mail" autocomplete="email" >
          </div>

          <div>
            <label for="senha" class="visually-hidden">Senha</label>
            <input id="senha" name="senha" type="password" class="form-control"
                   placeholder="Senha" aria-label="Senha" autocomplete="current-password" >
          </div>

          <button type="submit" class="btn mt-3 btn-brand btn-lg w-100">
            Entrar
          </button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
