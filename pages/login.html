<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge Swift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- link para o bootstrap -->
  <link rel="stylesheet" href="../Styles/login.css" />
  <!-- link para o arquivo especifico da página login -->
  <link rel="stylesheet" href="../Styles/global.css" />
  <!-- link para o estilo global que serve para reduzir o css e contribuir para boas práticas -->
</head>

<body>
  <main class="container-login">
    <!-- classe login para boas práticas -->
    <section class="login">
      <header class="cabecalho-login">
        <img src="../images/NOVA_LOGO_SWIFT_-removebg-preview 1.png" alt="" class="logo" />
        <!-- logo da swift -->
      </header>
      <form>
        <!-- form feito com bootstrap -->
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Insira seu e-mail:</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
          <div id="emailHelp" class="form-text">
            Não compartilhe seu email e senha com ninguém
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Digite sua senha:</label>
          <input type="password" class="form-control" id="exampleInputPassword1" />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1" />
          <label class="form-check-label" for="exampleCheck1">Salvar dados de entrada</label>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </section>
  </main>
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <!-- também colocado para adicionar bootstrap -->
</body>

</html>
